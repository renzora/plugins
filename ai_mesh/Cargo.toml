# Native plugin, shipped as source: the Renzora editor (and `cargo renzora`)
# compiles it against the engine it is installed in, not against wherever the
# `bevy` and `renzora` entries below point. They point rust-analyzer at the
# engine repository at an engine tag, which cargo clones once per machine; bump
# the tag to match the engine you target. Keep the `bevy` entry all the same:
# Bevy's derive macros look for it by name. `cargo build` here is refused by
# `renzora::plugin!` with an explanation, because it would build a second Bevy.
[workspace]

[package]
name = "ai_mesh"
version = "0.1.2"
edition = "2021"
description = "Generate textured 3D models from a prompt or an image with Meshy, Tripo, fal.ai or a local Hunyuan3D server, imported straight into the project."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26" }
# `editor` for `RenzoraShellExt::register_shell_panel` and `CurrentProject`.
# HTTP is `renzora::net`, and serde/serde_json come from the contract crate's
# re-exports, so this plugin's JSON is the engine's JSON.
renzora = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26", package = "renzora_sdk", features = ["editor", "ui"] }
# The panel, the settings section, and `WebImages` for result thumbnails.

# The native file dialog behind "Choose image...". The one thing cargo has to
# resolve for this plugin, so the first build needs a network.
rfd = "0.15"

# Marketplace listing (`renzora publish`). Cargo ignores this section.
[package.metadata.renzora]
marketplace_id = "ai_mesh"
category = "plugins"
name = "AI Mesh Generator"
tags = ["editor", "ai", "assets", "models", "generation"]
price_credits = 0
min_engine_version = "r1-alpha8"
