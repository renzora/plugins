# Native plugin, shipped as source: the Renzora editor (and `cargo renzora`)
# compiles it against the engine it is installed in, not against wherever the
# `bevy` and `renzora` entries below point. They point rust-analyzer at the
# engine repository at an engine tag, which cargo clones once per machine; bump
# the tag to match the engine you target. Keep the `bevy` entry all the same:
# Bevy's derive macros look for it by name. `cargo build` here is refused by
# `renzora::plugin!` with an explanation, because it would build a second Bevy.
[workspace]

[package]
name = "lens_distortion"
version = "0.1.1"
edition = "2021"
description = "Barrel and pincushion lens distortion, authored on the World Environment and routed onto cameras. Wraps Bevy's built-in LensDistortion effect."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26" }
renzora = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26", package = "renzora_sdk" }

# No `serde` entry. `LensDistortionSettings` is authored in scenes and needs the
# derives, but it takes them from `renzora::serde` — the engine's own copy. A
# privately resolved serde is a DIFFERENT crate, so `#[reflect(Serialize)]`
# would not be satisfied by it. Declaring nothing third-party also means cargo
# is never invoked here and the whole build is one `rustc`.

# Marketplace listing (`renzora publish`). Cargo ignores this section.
[package.metadata.renzora]
marketplace_id = "lens_distortion"
category = "plugins"
tags = ["post-processing", "shader", "camera", "lens", "distortion"]
price_credits = 0
min_engine_version = "r1-alpha7"
