# Copy to `mysql.toml` beside the game's executable, or in the project folder
# while developing. Every key is optional; these are the defaults.

# The `default` connection: mysql://user:password@host:port/database
url = "mysql://root@127.0.0.1:3306/renzora_saves"

# Keep the game's save slots in MySQL. false leaves them in the save folder
# while scripts can still query the database.
saves = true

# Let a networked client run the script functions. A client is the player's
# machine, so this file (and its password) would ship to every player: keep it
# false, run database calls on the server, and ship this file with the server
# only. Single-player and servers are never refused.
allow_clients = false

# The table save slots go in, keyed by the game's name.
table = "renzora_saves"

# Create the database in a URL on first use when it is missing.
create_database = true

# A call waits this long at most for the server, then fails with a reason.
connect_timeout_secs = 2
io_timeout_secs = 5

# More databases a script can name with its `connection` argument.
# [connections]
# stats = "mysql://reader:secret@127.0.0.1:3306/stats"
