# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependencies below exist so rust-analyzer can
# resolve `renzora::` and `renzora_ember::` while you author; the real build is
# the editor's, against `sdk/`.
[workspace]

[package]
name = "debugger"
# Ahead of the 1.0.0 already on the listing. It was published before the
# manifest claimed an id, so the manifest had drifted behind what shipped.
version = "1.1.0"
edition = "2021"
description = "The editor's debug readouts (performance, memory, ECS, cameras, culling, materials, scripting, UI, render toggles) as probes shown in the companion's Debug screen."

[package.metadata.renzora]
# The listing this publishes to. Claimed once and never changed: it is how a
# publish finds the existing listing rather than creating a second one.
marketplace_id = "debugger"
category = "plugins"
name = "Debugger"
tags = ["editor", "debugging", "diagnostics", "profiling"]
price_credits = 0
# r1-alpha8 is the engine this has actually been compiled against: the nightly
# plugin check builds the published set against the current engine, and nothing
# builds it against r1-alpha7. The APIs it uses (`register_panel_content`,
# `register_workspace`, the `diagnostics` feature) all existed in r1-alpha7, so
# this floor is probably stricter than it needs to be.
#
# Deliberately the strict way round. Claiming an engine it turns out not to
# build on produces failed installs; claiming one too new only means r1-alpha7
# users do not see it yet, and the release can be retargeted from the listing
# without republishing.
#
# 1.1.0 needs a later r1-alpha8 nightly than 1.0.x: the one with
# `renzora::probes` and the companion's Debug screen.
min_engine_version = "r1-alpha8"

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
# `diagnostics` is what carries the material and script perf tables plus the two
# count resources their owners publish. Those types live in the contract crate
# precisely so this plugin can name them: a native plugin links `bevy`,
# `renzora` and `renzora_ember` and nothing else, so a panel reading
# `renzora_shader::material::perf::MaterialPerfStats` could never have been one.
renzora = { path = "../../crates/renzora", features = ["editor", "diagnostics"] }
# The Settings section for stat refresh rates, and the UI diagnostics the UI
# probes read. Has to be the SHARED image, which is the whole reason a native
# plugin is bound to the engine build it was compiled against.
renzora_ember = { path = "../../../../crates/renzora_ember" }
# Resident-set and virtual-size readings for the Memory Profiler panel. Plain
# Rust with no Bevy in its graph, so the native-plugin dep resolver builds it
# with cargo into a private rlib and hands it to this plugin's `rustc` as an
# extra `--extern`.
memory-stats = "1"
