# Native plugin, shipped as source: the Renzora editor (and `cargo renzora`)
# compiles it against the engine it is installed in, not against wherever the
# `bevy` and `renzora` entries below point. They point rust-analyzer at the
# engine repository at an engine tag, which cargo clones once per machine; bump
# the tag to match the engine you target. Keep the `bevy` entry all the same:
# Bevy's derive macros look for it by name. `cargo build` here is refused by
# `renzora::plugin!` with an explanation, because it would build a second Bevy.
[workspace]

[package]
name = "procedural_tree"
version = "1.0.3"
edition = "2021"
description = "Procedurally generated 3D trees — seeded branch/leaf meshes that sway in the world wind."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26" }
renzora = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26", package = "renzora_sdk", features = ["ui"] }
# The generator's RNG. Plain Rust with no Bevy anywhere in its graph, so the
# native-plugin dep resolver builds it with cargo into a private rlib and hands
# it to the plugin's `rustc` as an extra `--extern`. A duplicate copy costs
# nothing: `fastrand` holds no process-global state the engine also owns.
fastrand = "2.3"

# No `serde` entry: `renzora::serde` is the engine's copy, and a private one
# would be a different trait from the one Bevy's `Vec3` implements. Every derive
# under `src/tree/` carries `#[serde(crate = "renzora::serde")]` to match.

# Marketplace listing (`renzora publish`). Cargo ignores this section.
[package.metadata.renzora]
marketplace_id = "procedural_tree"
category = "plugins"
tags = ["rendering", "vegetation", "procedural", "trees"]
price_credits = 0
thumbnail = "thumbnail.webp"
min_engine_version = "r1-alpha8"
