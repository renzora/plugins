[workspace]

[package]
name = "lua"
# Ahead of the 1.0.0 already on the listing. A published version is never
# replaced, so republishing 0.1.0 would be refused, and the manifest had drifted
# behind what was actually shipped.
version = "1.0.1"
edition = "2021"
description = "Lua scripting for Renzora. Implements the engine's language-backend contract."

# Read by the lean exporter, matched as a substring of the Rust target triple.
#
# mlua builds Lua from **C**, and wasm32-unknown-unknown has no libc sysroot for
# clang to compile it against — the build stops at `'stdlib.h' file not found`.
# That is the whole reason a web export has no text scripting: the host adopts a
# linked-in language backend exactly as it would a loaded one, so what is missing
# is a backend written in pure Rust, not any plumbing.
[package.metadata.renzora]
unsupported-targets = ["wasm32"]
# The listing this publishes to. It already exists and already holds this id;
# naming it here is what makes a publish land on it instead of creating a
# second listing beside it.
marketplace_id = "lua"
category = "plugins"
name = "Lua"
thumbnail = "thumbnail.png"
tags = ["scripting", "lua", "language"]
price_credits = 0
# It implements `renzora::ScriptBackend`, which only reached the contract
# crate (and therefore the plugin SDK) in r1-alpha8.
min_engine_version = "r1-alpha8"

# `dylib`, not `cdylib`. A native plugin links the real Bevy and the real
# engine crates, so the backend is an ordinary Rust trait impl rather than a
# function table behind an `extern "C"` entry point.
[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
# The shared types a backend deals in: `ScriptCommand`, `DrawCmd`, `Binding` and
# the declarative extension registry a backend builds its API from.
renzora = { path = "../../engine/crates/renzora" }
# `renzora` alone. The `ScriptBackend` trait, the context and variable types its
# hooks take, and `get_handler` all live in the contract crate, which is what
# makes a language implementable by an installed plugin at all: the staged SDK
# offers `bevy`, `renzora` and `renzora_ember`, and nothing else. The scripting
# system itself (`renzora_scripting`) is not linked here and does not need to be.

# Vendored so the plugin builds with nothing but a C compiler — no system Lua,
# no pkg-config, nothing for a plugin author to install. This is the entire
# reason the interpreter is worth moving out of the engine: mlua's C build now
# costs only the people who want Lua.
# `send` makes `Lua` `Send`, which a backend registered as a resource needs. It
# is not `Sync` even so, which is why the backend keeps its VMs behind a
# `Mutex` and why every hook takes `&self`.
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

# Blueprints are compiled to Lua by the *host* before the source reaches here —
# `renzora_blueprint` links Bevy and cannot cross the boundary. So this plugin
# claims the `.blueprint`/`.bp` extensions but only ever sees Lua text.
serde_json = "1"
