# Generated so Bevy's proc macros can resolve their own crate paths.
# Nothing runs cargo here; the plugin is compiled by rustc directly
# against the SDK. Replace this with your own manifest to develop the
# plugin as an ordinary cargo project — it will not be overwritten.
[package]
name = "solari"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
renzora = "*"

# Marketplace listing (`renzora publish`). Cargo ignores this section.
[package.metadata.renzora]
marketplace_id = "solari"
category = "plugins"
description = "Hardware ray-traced global illumination wrapping Bevy's experimental bevy_solari: realtime direct and indirect lighting, fully dynamic, with nothing to bake."
tags = ["rendering", "lighting", "raytracing", "global-illumination"]
price_credits = 0
min_engine_version = "r1-alpha7"
