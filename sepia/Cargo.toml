# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependency below exists so rust-analyzer can
# resolve `renzora::` while you author; the real build is `cargo renzora`.
[workspace]

[package]
name = "sepia"
version = "0.1.0"
edition = "2021"
description = "Sepia tone mapping."

[lib]
# `dylib` is what makes this a NATIVE plugin rather than a C-ABI one: it shares
# Rust types with the host. `cdylib` would be the C ABI, which links no Bevy.
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
renzora = { path = "../../engine/crates/renzora" }

# NOTE: no `serde` entry. Cargo would resolve a second copy, distinct from the
# one the engine's Bevy was built against, and deriving `Serialize` on a struct
# holding a `Vec3` then fails to compile. `#[post_process]` derives against
# `renzora::serde`, which is the engine's own copy, for exactly that reason.
