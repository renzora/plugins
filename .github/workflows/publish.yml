# =============================================================================
# Publish changed plugins to the marketplace
# =============================================================================
#
# A push to `main` publishes the plugins whose **version changed** in it. This
# workflow only ever publishes — the dry run is its own entry, `Dry run`, so
# the Actions sidebar says which is which and neither can be fired by mistake
# for the other. Both call the same job, so the dry run predicts this one rather
# than approximating it.
#
# The selection lives in `.github/scripts/publish-changed.sh`, which carries the
# reasoning for why the diff decides what to publish instead of
# `renzora publish --all`, and can be run by hand against any two commits:
#
#   .github/scripts/publish-changed.sh 5ae146d 72b3bfb --dry-run
name: Publish

on:
  push:
    branches: [main]
  # No dry-run toggle here on purpose. A manual publish is a deliberate act and
  # this workflow's name is the whole warning; anyone wanting to look first runs
  # `Dry run`, which cannot upload at all.
  workflow_dispatch:

concurrency:
  # Publishing is not idempotent — a version uploads once and can never be
  # replaced — so two runs must never overlap. Queued rather than cancelled:
  # cancelling mid-upload could leave a version half-created.
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-job.yml
    with:
      dry_run: false
    secrets: inherit
