# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependencies below exist so rust-analyzer can
# resolve `renzora::` and `renzora_ember::` while you author; the real build is
# the editor's, against `sdk/`.
[workspace]

[package]
name = "polyhaven"
version = "1.0.1"
edition = "2021"
description = "Browse Poly Haven's CC0 HDRIs, textures and models and import them straight into the project."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
# `editor` for `RenzoraShellExt::register_shell_panel` (the Add-Panel entry) and
# `CurrentProject` (where a download lands). `renzora::net::Request` is the other
# half of why this is a native plugin rather than a C-ABI one: the plugin HTTP
# domain hands a plugin `String`, and every file here is binary.
renzora = { path = "../../crates/renzora", features = ["editor"] }
# The panel itself: `register_panel_content`, the reactive layer, the widget set,
# and `MarkdownImages` — ember's async URL→`Handle<Image>` cache, which is what
# renders the thumbnail grid without this plugin owning a downloader of its own.
# Has to be the SHARED image, which is what binds a native plugin to the engine
# build it was compiled against.
renzora_ember = { path = "../../crates/renzora_ember" }

# Plain Rust with no Bevy in its graph, so the native-plugin dep resolver builds
# these with cargo into private rlibs and hands them to this plugin's `rustc` as
# extra `--extern`s. A private copy of serde is harmless: the reason `renzora`
# and `renzora_ember` must be shared is their process-global state, and serde has
# none. See `renzora_native_build::deps`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Marketplace listing (`renzora publish`). Cargo ignores this section.
[package.metadata.renzora]
marketplace_id = "polyhaven"
category = "plugins"
name = "PolyHaven"
thumbnail = "thumbnail.png"
tags = ["editor", "tools", "assets", "hdri", "textures"]
price_credits = 0
min_engine_version = "r1-alpha7"
