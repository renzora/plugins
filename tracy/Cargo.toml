# Declares its OWN workspace root. Without it cargo walks up, finds the engine's
# Cargo.toml and uses that workspace's target dir and profiles — even though
# `plugins` is in its `exclude` list, which only stops membership.
[workspace]

[package]
name = "tracy"
version = "0.1.0"
edition = "2021"
description = "Stream the engine's diagnostics to a running Tracy profiler."

# Read by the lean exporter, matched as a substring of the Rust target triple.
#
# `tracy-client` builds the Tracy C++ client through `cc`, which needs a libc
# sysroot wasm32-unknown-unknown does not have — and there is nothing for it to
# connect to from a browser tab in any case.
[package.metadata.renzora]
unsupported-targets = ["wasm32"]
# It reads `DiagnosticsStore` and registers a Settings section, neither of which
# the r1-alpha7 plugin boundary could carry.
min_engine_version = "r1-alpha8"

# `dylib`, not `cdylib`. A native plugin links the real Bevy and the real
# contract crate and takes `&mut World`; the C-ABI function table this used to
# export is gone.
[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
# `editor`, because the Settings section and the plugin's own `Editor` scope are
# both behind it. These paths are read by rust-analyzer and by Bevy's derive
# macros only: the plugin is compiled by `rustc` against the staged SDK, which
# supplies the real `--extern` edges.
renzora = { path = "../../engine/crates/renzora", features = ["editor"] }
renzora_ember = { path = "../../engine/crates/renzora_ember" }
# The Tracy protocol client. NOT `no_std`: this opens a socket and spawns Tracy's
# own worker thread, so std is not optional here the way it is for a
# post-process effect.
#
# `ondemand` is the feature that makes a dormant profiler free — without it the
# client accumulates trace data from startup whether or not anyone ever
# connects, which is what made Tracy expensive to leave compiled in. With it,
# nothing is buffered until a profiler attaches.
#
# `default-features = false` drops `enable`'s siblings we do not use (call-stack
# sampling, system tracing) — each costs a background thread and, on Windows,
# elevated-privilege probing at startup.
tracy-client = { version = "0.18", default-features = false, features = ["enable", "ondemand"] }
