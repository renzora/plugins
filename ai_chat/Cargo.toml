# Native plugin, shipped as source: the Renzora editor (and `cargo renzora`)
# compiles it against the engine it is installed in, not against wherever the
# `bevy` and `renzora` entries below point. They point rust-analyzer at the
# engine repository at an engine tag, which cargo clones once per machine; bump
# the tag to match the engine you target. Keep the `bevy` entry all the same:
# Bevy's derive macros look for it by name. `cargo build` here is refused by
# `renzora::plugin!` with an explanation, because it would build a second Bevy.
[workspace]

[package]
name = "ai_chat"
version = "0.1.2"
edition = "2021"
description = "Chat with a local or hosted LLM, in an editor panel."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26" }
renzora = { git = "https://github.com/renzora/engine", tag = "r1-alpha8-nightly-23nov26", package = "renzora_sdk", features = ["ui"] }

# HTTP is `renzora::net`, and `serde`/`serde_json` come from the contract crate's
# re-exports — a plugin's own copies would be different crates from the ones the
# engine's types are built against, and `Response::json::<T>()` would not accept
# a `T` derived against them.
#
# Native folder picker for the docs-folder setting. In the workspace this sat
# under `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]` because the
# crate was compiled for wasm alongside everything else and rfd has no folder
# picking there. A native plugin is never built for wasm — that target has no
# dylibs to load — so the guard is dead weight here and the dependency is plain.
#
# This is the one thing cargo has to resolve for this plugin, so the first build
# needs a network; everything after it is cached.
rfd = "0.15"

# Marketplace listing (`renzora publish`). Cargo ignores this section.
[package.metadata.renzora]
marketplace_id = "ai_chat"
category = "plugins"
tags = ["editor", "tools", "ai", "llm", "panel"]
price_credits = 0
thumbnail = "thumbnail.webp"
min_engine_version = "r1-alpha8"
